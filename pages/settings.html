<main class="content">

<div class="page-header glass">

<h1>Pengaturan Website</h1>

<p>
Kelola identitas dan konfigurasi WEBKITA.
</p>

</div>

<div class="glass settings-box">

<h2>Informasi Website</h2>

<div class="form-group">

<label>Nama Website</label>

<input
type="text"
value="WEBKITA">

</div>

<div class="form-group">

<label>Slogan</label>

<input
type="text"
value="Solusi Website Modern">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
value="admin@webkita.com">

</div>

<div class="form-group">

<label>Nomor WhatsApp</label>

<input
type="text"
value="6285188261698">

</div>

<div class="form-group">

<label>Alamat</label>

<textarea rows="4"></textarea>

</div>

<button class="btn-save">

<i class="fas fa-floppy-disk"></i>

Simpan Perubahan

</button>

</div>

<div class="glass settings-box">

<h2>Media Sosial</h2>

<div class="form-group">

<label>Instagram</label>

<input
type="text"
placeholder="https://instagram.com/...">

</div>

<div class="form-group">

<label>Facebook</label>

<input
type="text">

</div>

<div class="form-group">

<label>Telegram</label>

<input
type="text">

</div>

<button class="btn-save">

<i class="fas fa-floppy-disk"></i>

Simpan

</button>

</div>

<div class="glass settings-box">

<h2>Keamanan</h2>

<div class="form-group">

<label>Password Baru</label>

<input
type="password">

</div>

<div class="form-group">

<label>Konfirmasi Password</label>

<input
type="password">

</div>

<button class="btn-save">

<i class="fas fa-lock"></i>

Ubah Password

</button>

</div>

</main>

<script src="js/settings.js"></script>
