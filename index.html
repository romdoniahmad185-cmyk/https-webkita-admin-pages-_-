<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEBKITA | Dashboard Admin</title>

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="admin.css">
</head>

<body>

<!-- Background -->
<canvas id="bg-canvas"></canvas>

<!-- ================= NAVBAR ================= -->

<header class="navbar">

    <div class="logo">
        WEB<span class="gradient">KITA</span>
    </div>

    <div class="navbar-right">

        <button class="notification-btn">
            <i class="fas fa-bell"></i>
        </button>

        <div class="profile">

            <img src="images/admin.png" alt="Admin">

            <div class="profile-text">

                <h4>Administrator</h4>

                <small>Super Admin</small>

            </div>

            <i class="fas fa-chevron-down"></i>

        </div>

    </div>

</header>

<!-- ================ SIDEBAR ================= -->

<aside class="sidebar">

    <ul>

        <li class="active">
            <i class="fas fa-chart-pie"></i>
            Dashboard
        </li>

        <li>
            <i class="fas fa-cart-shopping"></i>
            Pesanan
        </li>

        <li>
            <i class="fas fa-users"></i>
            Pelanggan
        </li>

        <li>
            <i class="fas fa-layer-group"></i>
            Layanan
        </li>

        <li>
            <i class="fas fa-images"></i>
            Portofolio
        </li>

        <li>
            <i class="fas fa-circle-question"></i>
            FAQ
        </li>

        <li>
            <i class="fas fa-gear"></i>
            Pengaturan
        </li>

        <li class="logout">

            <i class="fas fa-right-from-bracket"></i>

            Logout

        </li>

    </ul>

</aside>

<!-- ================= CONTENT ================= -->

<main class="content">

    <section class="welcome glass">

        <div>

            <h1>Selamat Datang, Admin </h1>

            <p>
                Kelola seluruh layanan WEBKITA melalui dashboard ini.
            </p>

        </div>

    </section>

    <!-- CARD -->

    <section class="card-grid">

        <div class="dashboard-card glass">

            <div>

                <h3>Total Pesanan</h3>

                <h2>128</h2>

            </div>

            <i class="fas fa-cart-shopping"></i>

        </div>

        <div class="dashboard-card glass">

            <div>

                <h3>Pelanggan</h3>

                <h2>86</h2>

            </div>

            <i class="fas fa-users"></i>

        </div>

        <div class="dashboard-card glass">

            <div>

                <h3>Website Aktif</h3>

                <h2>57</h2>

            </div>

            <i class="fas fa-globe"></i>

        </div>

        <div class="dashboard-card glass">

            <div>

                <h3>Pendapatan</h3>

                <h2>Rp12.500.000</h2>

            </div>

            <i class="fas fa-wallet"></i>

        </div>

    </section>
